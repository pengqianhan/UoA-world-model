name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces the run in progress. On main a run is never cut short,
# because it ends in a deploy: the next push waits its turn.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Report bundle size
        run: du -sh dist && find dist -type f -printf '%s %p\n' | sort -nr | head -20
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: End-to-end tests against the production build (software WebGL)
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots
          path: |
            e2e/screenshots
            test-results
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Second copy of the site on Cloudflare Pages, where each school lives under its own path
  # (/uoa/). Skipped until the repository variable CLOUDFLARE_PROJECT names the Pages project;
  # the two secrets hold an API token with the "Cloudflare Pages: Edit" permission and the
  # account id.
  deploy-cloudflare:
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PROJECT != ''
    needs: [build, e2e]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CLOUDFLARE_PROJECT }}
      SCHOOL: uoa
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build for the school's path and lay out the site root
        run: |
          BASE_PATH="/$SCHOOL/" npm run build
          mkdir site
          mv dist "site/$SCHOOL"
          cp cloudflare/_headers cloudflare/_redirects site/
      - name: Create the Pages project on the first run
        run: npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main || true
      - name: Publish to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy site --project-name "$PROJECT" --branch main
